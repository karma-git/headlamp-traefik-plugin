name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Align package.json version
        run: npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: Checksum
        id: sum
        run: echo "value=$(sha256sum headlamp-traefik-plugin-${{ steps.v.outputs.version }}.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" "headlamp-traefik-plugin-${{ steps.v.outputs.version }}.tar.gz" --clobber
      - name: Update artifacthub-pkg.yml
        run: |
          V="${{ steps.v.outputs.version }}"
          sed -i -E \
            -e "s|^version: .*|version: $V|" \
            -e "s|^createdAt: .*|createdAt: '$(date -u +%Y-%m-%dT%H:%M:%SZ)'|" \
            -e "s|archive-url: .*|archive-url: https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/headlamp-traefik-plugin-$V.tar.gz|" \
            -e "s|archive-checksum: .*|archive-checksum: SHA256:${{ steps.sum.outputs.value }}|" \
            artifacthub-pkg.yml
      - name: Commit metadata to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacthub-pkg.yml package.json
          git diff --cached --quiet || git commit -m "chore: release ${{ steps.v.outputs.version }}"
          git push origin HEAD:main
